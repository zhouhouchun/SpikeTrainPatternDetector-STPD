name: PS and RGS core checks

on:
  push:
    branches:
      - codex/ps-rgs-core-v122
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::pkgload
          needs: check

      - name: Check package
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual"),
            error_on = "error",
            check_dir = "check"
          )

      - name: Run focused support and integration tests
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE)
          files <- c(
            "tests/testthat/test_poisson_surprise_support.R",
            "tests/testthat/test_rgs_support.R",
            "tests/testthat/test_multitrack_public_integration.R"
          )
          for (file in files) {
            testthat::test_file(file, reporter = "summary", stop_on_failure = TRUE)
          }
